version: "3.8"
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cospacedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - cospace_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cospacedb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cospacedb?schema=public
      DIRECT_URL: postgresql://postgres:postgres@db:5432/cospacedb?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cospace_postgres:
